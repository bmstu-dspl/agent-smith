services:
  ngrok:
    image: ngrok/ngrok:3.39.9-alpine
    profiles: ["dev"]
    restart: unless-stopped
    command: ["start", "--all", "--config", "/etc/ngrok/ngrok.yml"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./ngrok.yml:/etc/ngrok/ngrok.yml:ro
    ports:
      - "127.0.0.1:4040:4040"
    networks:
      - backend
    depends_on:
      bot:
        condition: service_healthy
