[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "httpx>=0.28.1",
    "langchain-core>=1.4.9",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.23.0",
    "fastapi>=0.100.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "booking"]
asyncio_mode = "auto"

[tool.uv.workspace]
members = ["booking"]