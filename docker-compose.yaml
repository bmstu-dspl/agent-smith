name: ${COMPOSE_PROJECT_NAME:-agent-smith}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-agent_smith}
  POSTGRES_USER: ${POSTGRES_USER:-agent_smith}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
  POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-10}

x-application: &application
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VCS_REF: ${VCS_REF:-unknown}
  pull_policy: build
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging
  networks:
    - backend

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_smith}
      POSTGRES_USER: ${POSTGRES_USER:-agent_smith}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2.0}
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}
    networks:
      - backend

  migrate:
    <<: *application
    restart: "no"
    command: ["python", "deploy/migrate.py"]
    environment:
      <<: *database-environment
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  ai-agent:
    <<: *application
    restart: unless-stopped
    command:
      - python
      - -m
      - uvicorn
      - ai_core.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - backend
      - egress
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: ${AI_AGENT_CPU_LIMIT:-1.0}
          memory: ${AI_AGENT_MEMORY_LIMIT:-512M}

  bot:
    <<: *application
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "run.py"]
    environment:
      <<: *database-environment
      BOT_TOKEN_FILE: /run/secrets/bot_token
      AI_AGENT_URL: http://ai-agent:8000
      WEBHOOK_HOST: https://${APP_DOMAIN:?APP_DOMAIN must be set}
      PORT: "8080"
      RUN_DB_MIGRATIONS: "false"
      DELETE_WEBHOOK_ON_SHUTDOWN: "false"
      DROP_PENDING_UPDATES: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - bot_token
      - postgres_password
    networks:
      - backend
      - egress
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-agent:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${BOT_CPU_LIMIT:-1.0}
          memory: ${BOT_MEMORY_LIMIT:-512M}

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: ${CADDY_CPU_LIMIT:-0.5}
          memory: ${CADDY_MEMORY_LIMIT:-128M}
    networks:
      - backend
      - edge
    depends_on:
      bot:
        condition: service_healthy

secrets:
  bot_token:
    file: ${SECRETS_DIR:-./secrets}/bot_token
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  egress:
  edge:
